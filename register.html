<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Ascend</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-shell">
  <a href="index.html" class="back-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to home
  </a>

  <div class="auth-card">
    <a href="index.html" class="auth-brand">
      <span class="mark">A</span>
      <span class="name">Ascend</span>
    </a>

    <h1>Create your account</h1>
    <p class="auth-sub">Start tracking every application in one place.</p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" class="input" placeholder="e.g. Mahima Sharma" autocomplete="name" />
      </div>

      <div class="field">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" class="input" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="register-password">Password</label>
        <div class="password-wrap">
          <input type="password" id="register-password" class="input" placeholder="Create a password" autocomplete="new-password" />
          <button type="button" class="password-toggle" aria-label="Toggle password visibility"></button>
        </div>
        <span class="field-hint">At least 6 characters</span>
      </div>

      <div class="field">
        <label for="register-confirm">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="register-confirm" class="input" placeholder="Re-enter your password" autocomplete="new-password" />
          <button type="button" class="password-toggle" aria-label="Toggle password visibility"></button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">Sign Up</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <div class="mini-pipeline-hint">
    <span class="dot"></span>
    Wishlist → Applied → OA → Interview → Offer
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
